<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PocketSim Factory</title>
  <meta name="description" content="Baue in 3D eine Fabrik in Remscheid auf – vom ersten Bohrer bis zur durchgetakteten Fertigung.">
  <meta name="theme-color" content="#101010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <header class="topbar">
      <div class="brand"><span class="pulse"></span><span>POCKETSIM <small>/ FACTORY</small></span></div>
      <div class="hud">
        <div class="stat"><label>Kapital</label><b id="money">–</b><span id="income" class="delta"></span></div>
        <div class="stat power"><label>Strom</label><div class="meter"><i id="powerBar"></i></div><span id="powerText"></span></div>
        <div class="stat clock"><label id="dayLabel">Tag 1</label><b id="clock">08:00</b><span id="weather"></span></div>
        <div class="speed" id="speed"></div>
      </div>
      <nav class="menu">
        <button data-open="research" title="Forschung (F)"><i data-icon="flask"></i><span>Forschung</span><em id="researchBadge" class="badge hidden"></em></button>
        <button data-open="stats" title="Statistik (T)"><i data-icon="chart"></i><span>Statistik</span></button>
        <button data-open="menu" title="Menü (Esc)"><i data-icon="menu"></i><span>Menü</span></button>
      </nav>
    </header>

    <div id="eventBanner" class="event hidden"></div>

    <aside class="sidebar">
      <section id="goal" class="card goal"></section>
      <section class="card contracts">
        <h3>Aufträge <span id="contractCount"></span></h3>
        <div id="contracts"></div>
      </section>
    </aside>

    <section id="inspector" class="card inspector hidden"></section>
    <div id="hoverInfo" class="hover-info"></div>
    <div id="tooltip" class="tooltip hidden"></div>

    <footer class="dock">
      <div class="tools" id="tools"></div>
      <div class="build">
        <div class="cats" id="cats"></div>
        <div class="items" id="buildItems"></div>
      </div>
    </footer>

    <div id="toasts"></div>
    <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" data-close>&times;</button><div id="modalBody"></div></div></div>
  </div>

  <div id="title" class="title-screen">
    <div class="title-card">
      <div class="eyebrow"><span class="pulse"></span>Factory · Remscheid</div>
      <h1>PocketSim</h1>
      <p>Bohren, schmelzen, pressen, montieren. Du baust in Remscheid eine Fabrik auf, vom ersten Bohrer bis zur durchgetakteten Fertigung.</p>
      <div class="title-actions" id="titleActions"></div>
      <details class="seed">
        <summary>Eigene Welt</summary>
        <label>Seed <input id="seedInput" inputmode="numeric" placeholder="zufällig"></label>
      </details>
      <div class="loading" id="loading">Lade 3D-Engine …</div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
