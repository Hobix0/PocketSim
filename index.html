<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PocketSim Straße</title>
  <meta name="description" content="Gemütliche Ladenstraße im Herbst: Café, Fast Food, Boutique und Supermarkt bauen, einrichten und führen.">
  <meta name="theme-color" content="#2f4a42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <header class="topbar">
      <div class="brand">PocketSim <em>Straße</em></div>
      <div class="stats">
        <div class="stat"><label>Kasse</label><b id="money">–</b></div>
        <div class="stat"><label id="dayLabel">Tag 1</label><b><span id="clock">07:00</span> <span id="weather" class="wx"></span></b></div>
        <div class="stat"><label>Ruf</label><b id="rep" class="stars"></b></div>
      </div>
      <div class="speed" id="speed"></div>
      <nav class="menu" id="menu"></nav>
    </header>

    <aside class="side">
      <section class="card shop" id="shopCard"></section>
      <section class="card quest" id="questCard"></section>
      <section class="card steps" id="steps"></section>
    </aside>

    <nav class="floors" id="lots"></nav>

    <section class="card inspector hidden" id="inspector"></section>

    <footer class="dock">
      <div class="tools" id="tools"></div>
      <div class="catalog hidden" id="catalog">
        <div class="cats" id="cats"></div>
        <div class="items" id="items"></div>
        <div class="variants" id="variants"></div>
      </div>
      <div class="hint" id="hint"></div>
    </footer>

    <div id="toasts"></div>
    <div id="photoBar" class="photobar hidden">
      <button data-photo="morning">🌅 Morgen</button><button data-photo="noon">☀️ Mittag</button><button data-photo="evening">🌇 Abend</button>
      <button data-photo="save">💾 Bild speichern</button><button data-photo="exit">✕ Zurück</button>
    </div>
    <div id="modal" class="modal hidden"><div class="sheet"><button class="close" data-close aria-label="Schließen">×</button><div id="modalBody"></div></div></div>
  </div>

  <div id="title" class="title">
    <div class="title-card">
      <div class="eyebrow">🍂 Gemütliche Wirtschaftssimulation</div>
      <h1>PocketSim <em>Straße</em></h1>
      <p>Oktober in der Altstadt. Draußen fällt das Laub, in den Schaufenstern geht das Licht an. Kauf Grundstücke, bau deine eigenen Läden, richte sie gemütlich ein und freunde dich mit der Nachbarschaft an.</p>
      <div class="title-actions" id="titleActions"></div>
      <div class="loading" id="loading">Lade 3D-Engine …</div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
